openapi: 3.0.3
info:
  title: NovaMarket Product Service
  description: Internal product service contract. Public clients use NovaApiGateway.
  version: 1.0.0
servers:
  - url: http://localhost:3003
    description: Local development
tags:
  - name: System
    description: Common service health and monitoring endpoints
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check liveness
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [System]
      operationId: getReady
      summary: Check readiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Get service version
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: Get Prometheus metrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /api/products/{id}/reviews:
    post:
      tags: [Reviews]
      operationId: createProductReview
      summary: Submit a product review for moderation
      description: Reviews are stored as pending after a matching order.delivered event verifies the purchase.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: x-user-id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              additionalProperties: false
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, minLength: 1 }
      responses:
        '201': { description: Review accepted for moderation }
        '400': { description: Invalid review input }
        '401': { description: User identity is missing }
        '403': { description: No delivered purchase eligibility exists for this user and product }
        '404': { description: Active product not found }

  /products:
    get:
      tags:
        - Products
      summary: Get products
      operationId: getProducts
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/BrandQuery'
        - $ref: '#/components/parameters/MinPriceQuery'
        - $ref: '#/components/parameters/MaxPriceQuery'
        - $ref: '#/components/parameters/MinRatingQuery'
        - $ref: '#/components/parameters/OnSaleQuery'
        - $ref: '#/components/parameters/SortQuery'

      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items: 
                  $ref: '#/components/schemas/ProductSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    SearchQuery:
      name: search
      in: query
      required: false
      description: Search products by name, brand or tags
      schema:
        type: string
        maxLength: 100
        example: iphone

    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    CategoryQuery:
      name: category
      in: query
      required: false
      description: Filter products by category ID
      schema:
        type: string
        format: uuid

    BrandQuery:
      name: brand
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
        example: Apple

    MinPriceQuery:
      name: minPrice
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: 0
        example: 100

    MaxPriceQuery:
      name: maxPrice
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: 0
        example: 2000

    MinRatingQuery:
      name: minRating
      in: query
      required: false
      schema:
        type: number
        format: double
        minimum: 0
        maximum: 5
        default: 0
        example: 4

    OnSaleQuery:
      name: onSale
      in: query
      required: false
      schema:
        type: boolean
        default: false
        example: true

    SortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - relevance
          - newest
          - price_asc
          - price_desc
          - rating
          - popularity
        default: relevance

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: BAD_REQUEST

            message:
              type: string
              example: Invalid request parameters

            details:
              type: object
              additionalProperties: true
    ProductSummary:
      type: object
      required:
        - id
        - name
        - price
        - rating
        - reviewsCount
        - storeId
        - categoryId
        - status
        - images
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        brand:
          type: string
          nullable: true
        price:
          type: number
          format: double
        rating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        reviewsCount:
          type: integer
          minimum: 0
        storeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProductStatus"
        images:
          type: string
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string


    ProductModerationStatus:
      type: string
      enum:
        - draft
        - pending
        - approved
        - rejected
    ProductStatus:
      type: string
      enum:
        - active
        - inactive
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready] }
        checks: { type: object, additionalProperties: { type: string } }
    NotReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [not_ready] }
        checks: { type: object, additionalProperties: { type: string } }
    VersionResponse:
      type: object
      required: [service, version, commit]
      properties:
        service: { type: string }
        version: { type: string }
        commit: { type: string }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'